text><rect x="266" y="804" width="130" height="50" rx="10" fill="#FF385C" stroke="none" stroke-width="1" /><text x="331" y="835" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle" >Reserve</text><circle cx="60" cy="320" r="13" fill="#222222"/><text x="60" y="324.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text><circle cx="382" cy="382" r="13" fill="#222222"/><text x="382" y="386.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text><circle cx="382" cy="448" r="13" fill="#222222"/><text x="382" y="452.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text><circle cx="382" cy="590" r="13" fill="#222222"/><text x="382" y="594.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text><circle cx="382" cy="690" r="13" fill="#222222"/><text x="382" y="694.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text><circle cx="230" cy="772" r="13" fill="#222222"/><text x="230" y="776.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">6</text></g>
<text x="470" y="70" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#222222">3 · Listing</text>
<text x="470" y="94" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#717171">Reference for the Airbnb Replica Challenge</text>
<circle cx="483" cy="135" r="13" fill="#222222"/><text x="483" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="506" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#222222">Photo gallery</text>
<text x="506" y="161" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#717171">Full-bleed photo with round buttons</text>
<text x="506" y="180" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#717171">for back, share and save; a counter.</text>
<circle cx="483" cy="219" r="13" fill="#222222"/><text x="483" y="224" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="506" y="224" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#222222">Title block</text>
<text x="506" y="245" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#717171">The sheet overlaps the photo with</text>
<text x="506" y="264" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#717171">rounded top corners; centred text.</text>
<circle cx="483" cy="303" r="13" fill="#222222"/><text x="483" y="308" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="506" y="308" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#222222">Highlights row</text>
<text x="506" y="329" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#717171">Outlined box split into three by</text>
<text x="506" y="348" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#717171">thin dividers.</text>
<circle cx="483" cy="387" r="13" fill="#222222"/><text x="483" y="392" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="506" y="392" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#222222">Host row</text>
<text x="506" y="413" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#717171">Round avatar, bold name, grey detail;</text>
<text x="506" y="432" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#717171">thin lines above and below.</text>
<circle cx="483" cy="471" r="13" fill="#222222"/><text x="483" y="476" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<text x="506" y="476" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#222222">Amenities</text>
<text x="506" y="497" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#717171">Outline icon, bold title, grey</text>
<text x="506" y="516" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#717171">description; repeat the pattern.</text>
<circle cx="483" cy="555" r="13" fill="#222222"/><text x="483" y="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">6</text>
<text x="506" y="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#222222">Reserve bar</text>
<text x="506" y="581" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#717171">Sticky footer: price and dates on the</text>
<text x="506" y="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#717171">left, pink Reserve button on the right.</text>
<text x="470" y="870" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#717171">Original illustration for teaching. Match the real app with your own screenshots.</text>
</svg>