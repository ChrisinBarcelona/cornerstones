<text x="470" y="70" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#222222">2 · Search</text>
<text x="470" y="94" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#717171">Reference for the Airbnb Replica Challenge</text>
<circle cx="483" cy="135" r="13" fill="#222222"/><text x="483" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="506" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#222222">Expanded step</text>
<text x="506" y="161" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#717171">White card with a big bold question</text>
<text x="506" y="180" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#717171">and a rounded search field.</text>
<circle cx="483" cy="219" r="13" fill="#222222"/><text x="483" y="224" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="506" y="224" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#222222">Region tiles</text>
<text x="506" y="245" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#717171">Square photo tiles in a row that</text>
<text x="506" y="264" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#717171">scrolls sideways; label underneath.</text>
<circle cx="483" cy="303" r="13" fill="#222222"/><text x="483" y="308" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="506" y="308" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#222222">Collapsed steps</text>
<text x="506" y="329" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#717171">Same card, closed: label on the left,</text>
<text x="506" y="348" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#717171">current value in bold on the right.</text>
<circle cx="483" cy="387" r="13" fill="#222222"/><text x="483" y="392" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="506" y="392" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#222222">Footer actions</text>
<text x="506" y="413" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#717171">Text link to clear; the pink button</text>
<text x="506" y="432" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#717171">is the one main action.</text>
<text x="470" y="870" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#717171">Original illustration for teaching. Match the real app with your own screenshots.</text>
